name = "dashboard-anepc-epe"
main = "src/index.js"
compatibility_date = "2026-08-09"
workers_dev = true

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[[durable_objects.bindings]]
name = "AUTH_STORE"
class_name = "UserStore"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["UserStore"]

[vars]
GITHUB_OWNER = "ANEPCVCT"
GITHUB_REPO = "Dashboard"
GITHUB_WORKFLOW = "atualizar-epe.yml"
GITHUB_REF = "main"

