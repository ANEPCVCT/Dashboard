<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Operacional — Alto Minho</title>

    <style>
        :root {
            --header-height: clamp(88px, 11vh, 122px);
            --page-gap: clamp(8px, 0.65vw, 14px);
            --page-padding: clamp(8px, 0.65vw, 14px);
            --border-color: #25313b;
            --panel-background: #ffffff;
            --panel-title-background: #f3f5f6;
            --page-background: #e8ecef;
            --text-color: #18232d;
            --muted-color: #5b6872;
            --brand-red: #a7191f;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
        }

        body {
            background: var(--page-background);
            color: var(--text-color);
            font-family: Arial, Helvetica, sans-serif;
        }

        #main-container {
            display: grid;
            grid-template-rows: var(--header-height) minmax(0, 1fr);
            width: 100vw;
            height: 100vh;
            height: 100dvh;
        }

        /* Cabeçalho geral, fora da área útil de 50% reservada ao IRI. */
        #brand-header {
            display: grid;
            grid-template-columns: clamp(78px, 7vw, 112px) minmax(0, 1fr);
            align-items: center;
            gap: clamp(12px, 1.2vw, 24px);
            min-width: 0;
            padding: 8px var(--page-padding);
            background: #ffffff;
            border-bottom: 3px solid var(--brand-red);
        }

        #brand-header img {
            display: block;
            width: 100%;
            max-height: calc(var(--header-height) - 16px);
            object-fit: contain;
            object-position: left center;
        }

        #brand-header h1 {
            min-width: 0;
            margin: 0;
            font-size: clamp(25px, 2.2vw, 42px);
            font-weight: 700;
            line-height: 1.05;
            letter-spacing: 0.01em;
            color: #202b34;
        }

        /* Duas metades horizontais iguais abaixo do cabeçalho. */
        #dashboard-grid {
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
            gap: var(--page-gap);
            min-width: 0;
            min-height: 0;
            padding: var(--page-padding);
        }

        /*
         * Metade esquerda: apenas IRI.
         * Hoje ocupa a metade superior; amanhã e depois de amanhã
         * dividem, em partes iguais, a metade inferior.
         */
        #iri-area {
            display: grid;
            grid-template-rows: minmax(0, 1fr) minmax(0, 1fr);
            gap: var(--page-gap);
            min-width: 0;
            min-height: 0;
        }

        #iri-futuro {
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
            gap: var(--page-gap);
            min-width: 0;
            min-height: 0;
        }

        .palco {
            display: flex;
            flex-direction: column;
            min-width: 0;
            min-height: 0;
            overflow: hidden;
            background: var(--panel-background);
            border: 2px solid var(--border-color);
            border-radius: 8px;
            box-shadow: 0 2px 6px rgb(29 43 54 / 12%);
        }

        .palco-titulo {
            flex: 0 0 auto;
            min-height: clamp(34px, 4.1vh, 48px);
            display: flex;
            align-items: center;
            padding: 5px clamp(8px, 0.7vw, 14px);
            background: var(--panel-title-background);
            border-bottom: 1px solid #c8d0d5;
            color: #35434e;
            font-size: clamp(15px, 1vw, 20px);
            font-weight: 700;
            line-height: 1.1;
            text-transform: uppercase;
        }

        .palco-conteudo {
            position: relative;
            flex: 1 1 auto;
            min-width: 0;
            min-height: 0;
        }

        .iri-map-frame {
            position: absolute;
            inset: 0;
            display: grid;
            place-items: center;
            overflow: hidden;
            width: 100%;
            height: 100%;
            background: #e3e6e8;
        }

        /*
         * Todos os PNG foram desenhados sobre a mesma tela de 743 × 662 px.
         * A pilha tem uma única geometria; assim, cada pixel de cada concelho
         * coincide com o mesmo pixel das restantes camadas.
         */
        .iri-image-stack {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        .iri-image-layer {
            position: absolute;
            inset: 0;
            display: block;
            width: 100%;
            height: 100%;
            object-fit: contain;
            object-position: center;
            pointer-events: none;
            user-select: none;
        }

        .iri-concelho-layer {
            z-index: 10;
        }

        .iri-tracado-layer {
            z-index: 20;
        }

        .map-loading {
            position: absolute;
            z-index: 1000;
            inset: 50% auto auto 50%;
            transform: translate(-50%, -50%);
            max-width: calc(100% - 24px);
            padding: 9px 12px;
            border: 1px solid #b6c0c7;
            border-radius: 5px;
            background: rgb(255 255 255 / 94%);
            color: #46545e;
            font-size: clamp(12px, 0.8vw, 16px);
            font-weight: 700;
            line-height: 1.25;
            text-align: center;
            pointer-events: none;
        }

        .map-loading.erro {
            color: #8f1117;
            border-color: #c55d62;
            background: #fff2f2;
        }

        /*
         * Metade direita provisória. O conteúdo não é redesenhado nesta fase;
         * fica separado do IRI para ser definido no passo seguinte.
         */
        #right-area {
            display: grid;
            grid-template-rows: minmax(0, 1fr) minmax(0, 1fr);
            gap: var(--page-gap);
            min-width: 0;
            min-height: 0;
        }

        #avisos-conteudo {
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding: 10px;
            overflow-y: auto;
            font-size: clamp(12px, 0.75vw, 15px);
        }

        .aviso-item {
            display: flex;
            align-items: center;
            padding: 6px;
            border: 1px solid #c6cdd2;
            border-radius: 5px;
        }

        .aviso-icone {
            width: 30px;
            height: 30px;
            margin-right: 8px;
            object-fit: contain;
        }

        .aviso-texto {
            flex: 1;
            line-height: 1.25;
        }

        .aviso-tempo {
            display: block;
            color: #34414a;
            font-size: 0.9em;
            font-weight: 700;
        }

        .aviso-yellow { background: #fffde7; border-color: #fbc02d; }
        .aviso-orange { background: #fff3e0; border-color: #f57c00; }
        .aviso-red { background: #ffebee; border-color: #d32f2f; }
        .aviso-green { background: #e8f5e9; border-color: #388e3c; }

        #controls-area {
            display: grid;
            grid-template-rows: auto auto minmax(0, 1fr);
            gap: 10px;
            height: 100%;
            padding: 12px;
        }

        .dropdown-box {
            width: 100%;
            padding: 9px 10px;
            border: 2px solid #45525c;
            border-radius: 5px;
            background: #ffffff;
            color: #1e2932;
            font-size: clamp(15px, 1vw, 19px);
            font-weight: 700;
        }

        #sidebar-map-placeholder {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 0;
            border: 2px dashed #9ba5ac;
            background: #e4e7e9;
            color: #64717a;
            font-style: italic;
        }

        @media (max-aspect-ratio: 4 / 3) {
            :root {
                --header-height: clamp(82px, 10vh, 104px);
            }

            #brand-header h1 {
                font-size: clamp(22px, 2.5vw, 34px);
            }
        }
    </style>
</head>

<body>
    <div id="main-container">
        <header id="brand-header">
            <img src="anepc_logo.png" alt="Logótipo da ANEPC">
            <h1>Comando Sub-Regional do Alto Minho</h1>
        </header>

        <main id="dashboard-grid">
            <section id="iri-area" aria-label="Índice de Risco de Incêndio">
                <article class="palco" id="palco-iri-hoje">
                    <div class="palco-titulo">IRI — Hoje</div>
                    <div class="palco-conteudo">
                        <div class="iri-map-frame">
                            <div id="mapa-iri0" class="iri-image-stack"></div>
                        </div>
                        <div class="map-loading" id="load0">A carregar IRI de hoje…</div>
                    </div>
                </article>

                <div id="iri-futuro">
                    <article class="palco" id="palco-iri-amanha">
                        <div class="palco-titulo">IRI — Amanhã</div>
                        <div class="palco-conteudo">
                            <div class="iri-map-frame">
                                <div id="mapa-iri1" class="iri-image-stack"></div>
                            </div>
                            <div class="map-loading" id="load1">A carregar IRI de amanhã…</div>
                        </div>
                    </article>

                    <article class="palco" id="palco-iri-depois">
                        <div class="palco-titulo">IRI — Depois de amanhã</div>
                        <div class="palco-conteudo">
                            <div class="iri-map-frame">
                                <div id="mapa-iri2" class="iri-image-stack"></div>
                            </div>
                            <div class="map-loading" id="load2">A carregar IRI…</div>
                        </div>
                    </article>
                </div>
            </section>

            <aside id="right-area" aria-label="Área direita provisória">
                <section class="palco" id="palco-avisos">
                    <div class="palco-titulo">Avisos meteorológicos</div>
                    <div class="palco-conteudo" id="avisos-conteudo">A carregar avisos…</div>
                </section>

                <section class="palco" id="palco-operacional">
                    <div class="palco-titulo">Nível operacional</div>
                    <div class="palco-conteudo" id="controls-area">
                        <strong>Nível Operacional (CDOS):</strong>
                        <select class="dropdown-box" aria-label="Nível Operacional">
                            <option>N (Normal)</option>
                            <option>I (Elevado)</option>
                            <option>II (Muito Elevado)</option>
                            <option>III (Máximo)</option>
                            <option>IV (Catástrofe)</option>
                        </select>
                        <div id="sidebar-map-placeholder">Área a definir na próxima fase</div>
                    </div>
                </section>
            </aside>
        </main>
    </div>

    <script>
        'use strict';

        const concelhoNomes = {
            '1601': 'arcos',
            '1602': 'caminha',
            '1603': 'melgaco',
            '1604': 'moncao',
            '1605': 'coura',
            '1606': 'pbarca',
            '1607': 'plima',
            '1608': 'valenca',
            '1609': 'viana',
            '1610': 'cerveira'
        };

        const nivelPasta = {
            '1': 'IRI Reduzido',
            '2': 'IRI Moderado',
            '3': 'IRI Elevado',
            '4': 'IRI Muito Elevado',
            '5': 'IRI Maximo'
        };

        const nomesRisco = {
            '1': 'Reduzido',
            '2': 'Moderado',
            '3': 'Elevado',
            '4': 'Muito elevado',
            '5': 'Máximo'
        };

        const nomesConcelho = {
            '1601': 'Arcos de Valdevez',
            '1602': 'Caminha',
            '1603': 'Melgaço',
            '1604': 'Monção',
            '1605': 'Paredes de Coura',
            '1606': 'Ponte da Barca',
            '1607': 'Ponte de Lima',
            '1608': 'Valença',
            '1609': 'Viana do Castelo',
            '1610': 'Vila Nova de Cerveira'
        };

        const intervaloAtualizacaoIriMs = 60 * 60 * 1000;
        let atualizacaoIriEmCurso = false;

        function definirEstadoLoading(loadingId, mensagem, erro = false) {
            const elemento = document.getElementById(loadingId);
            elemento.textContent = mensagem;
            elemento.classList.toggle('erro', erro);
            elemento.style.display = 'block';
        }

        function esconderLoading(loadingId) {
            document.getElementById(loadingId).style.display = 'none';
        }

        function extrairRiscoDistrital(json) {
            const resultado = {};

            if (!json || typeof json.local !== 'object' || json.local === null) {
                return resultado;
            }

            Object.entries(json.local).forEach(([dico, local]) => {
                const risco = String(local?.data?.rcm ?? '');

                if (dico.startsWith('16') && nivelPasta[risco]) {
                    resultado[dico] = risco;
                }
            });

            return resultado;
        }

        function adicionarImagemConcelho(pilha, dico, risco) {
            return new Promise((resolve) => {
                const pasta = nivelPasta[risco];
                const ficheiro = concelhoNomes[dico];
                const urlImagem = `${pasta}/${ficheiro}.png`;
                const imagem = document.createElement('img');

                imagem.className = 'iri-image-layer iri-concelho-layer';
                imagem.alt = `${nomesConcelho[dico]} — risco ${nomesRisco[risco]}`;
                imagem.dataset.dico = dico;
                imagem.dataset.risco = risco;
                imagem.addEventListener(
                    'load',
                    () => resolve({ dico, estado: 'carregado' }),
                    { once: true }
                );
                imagem.addEventListener(
                    'error',
                    () => resolve({ dico, estado: 'erro', urlImagem }),
                    { once: true }
                );

                pilha.appendChild(imagem);
                imagem.src = urlImagem;
            });
        }

        function adicionarTracado(pilha) {
            return new Promise((resolve) => {
                const tracado = document.createElement('img');

                tracado.className = 'iri-image-layer iri-tracado-layer';
                tracado.alt = '';
                tracado.setAttribute('aria-hidden', 'true');
                tracado.addEventListener(
                    'load',
                    () => resolve({ estado: 'carregado' }),
                    { once: true }
                );
                tracado.addEventListener(
                    'error',
                    () => resolve({ estado: 'erro', urlImagem: 'tracadovct.png' }),
                    { once: true }
                );

                /* Inserido por último e com z-index superior: é sempre o topo. */
                pilha.appendChild(tracado);
                tracado.src = 'tracadovct.png';
            });
        }

        async function carregarConcelhosPNG(pilhaId, dadosRcmIpma, loadingId) {
            const pilha = document.getElementById(pilhaId);
            const concelhosComDados = Object.keys(concelhoNomes).filter(
                (dico) => Boolean(dadosRcmIpma[dico])
            );

            if (concelhosComDados.length === 0) {
                throw new Error('A resposta do IPMA não contém dados IRI para o Alto Minho.');
            }

            pilha.replaceChildren();

            const [resultados, resultadoTracado] = await Promise.all([
                Promise.all(
                    concelhosComDados.map((dico) =>
                        adicionarImagemConcelho(pilha, dico, dadosRcmIpma[dico])
                    )
                ),
                adicionarTracado(pilha)
            ]);

            const falhas = resultados.filter((resultado) => resultado.estado === 'erro');

            if (resultadoTracado.estado === 'erro') {
                falhas.push(resultadoTracado);
            }

            if (falhas.length > 0) {
                console.error('Imagens IRI em falta ou inacessíveis:', falhas);
                definirEstadoLoading(
                    loadingId,
                    `${falhas.length} imagem(ns) IRI não carregaram.`,
                    true
                );
                return;
            }

            esconderLoading(loadingId);
        }

        async function obterJson(url) {
            const resposta = await fetch(url, { cache: 'no-store' });

            if (!resposta.ok) {
                throw new Error(`Pedido falhou com HTTP ${resposta.status}.`);
            }

            return resposta.json();
        }

        async function carregarIri() {
            const baseUrl = 'https://api.ipma.pt/open-data/forecast/meteorology/rcm/';
            const pedidos = ['rcm-d0.json', 'rcm-d1.json', 'rcm-d2.json'].map(
                (ficheiro) => obterJson(baseUrl + ficheiro)
            );

            const respostas = await Promise.allSettled(pedidos);

            await Promise.all(
                respostas.map(async (resposta, indice) => {
                    const loadingId = `load${indice}`;

                    if (resposta.status === 'rejected') {
                        console.error(`Erro ao carregar IRI D${indice}:`, resposta.reason);
                        definirEstadoLoading(loadingId, 'IRI temporariamente indisponível.', true);
                        return;
                    }

                    try {
                        const risco = extrairRiscoDistrital(resposta.value);
                        await carregarConcelhosPNG(`mapa-iri${indice}`, risco, loadingId);
                    } catch (erro) {
                        console.error(`Erro ao apresentar IRI D${indice}:`, erro);
                        definirEstadoLoading(loadingId, 'Não foi possível apresentar o IRI.', true);
                    }
                })
            );
        }

        async function atualizarIri() {
            if (atualizacaoIriEmCurso) {
                return;
            }

            atualizacaoIriEmCurso = true;

            try {
                await carregarIri();
            } finally {
                atualizacaoIriEmCurso = false;
            }
        }

        async function carregarAvisos() {
            const container = document.getElementById('avisos-conteudo');
            const tipoAvisoIcons = {
                'Precipitação': 'https://cdn-icons-png.flaticon.com/512/4005/4005771.png',
                'Vento': 'https://cdn-icons-png.flaticon.com/512/5444/5444465.png',
                'Agitação Marítima': 'https://cdn-icons-png.flaticon.com/512/3104/3104564.png',
                'Trovoada': 'https://cdn-icons-png.flaticon.com/512/4150/4150897.png',
                'Nevoeiro': 'https://cdn-icons-png.flaticon.com/512/760/760444.png',
                'Tempo Frio': 'https://cdn-icons-png.flaticon.com/512/5353/5353179.png'
            };
            const classes = {
                yellow: 'aviso-yellow',
                orange: 'aviso-orange',
                red: 'aviso-red',
                green: 'aviso-green'
            };

            try {
                const data = await obterJson(
                    'https://api.ipma.pt/open-data/forecast/warnings/warnings_www.json'
                );
                const avisosViana = data.filter(
                    (aviso) =>
                        aviso.idAreaAviso === 'VVC' &&
                        aviso.awarenessLevelID !== 'green'
                );

                if (avisosViana.length === 0) {
                    container.innerHTML =
                        '<div class="aviso-item aviso-green">Sem avisos meteorológicos ativos.</div>';
                    return;
                }

                container.replaceChildren();

                avisosViana.forEach((aviso) => {
                    const item = document.createElement('div');
                    const icone = tipoAvisoIcons[aviso.awarenessTypeName] ||
                        'https://cdn-icons-png.flaticon.com/512/1795/1795519.png';
                    const classeFundo = classes[aviso.awarenessLevelID] || '';
                    const inicio = new Date(aviso.startTime).toLocaleString('pt-PT', {
                        day: '2-digit',
                        month: '2-digit',
                        hour: '2-digit',
                        minute: '2-digit'
                    });
                    const fim = new Date(aviso.endTime).toLocaleString('pt-PT', {
                        day: '2-digit',
                        month: '2-digit',
                        hour: '2-digit',
                        minute: '2-digit'
                    });

                    item.className = `aviso-item ${classeFundo}`;
                    item.innerHTML = `
                        <img src="${icone}" class="aviso-icone" alt="">
                        <div class="aviso-texto">
                            <strong>${aviso.awarenessTypeName}</strong>
                            <span class="aviso-tempo">Início: ${inicio} — Fim: ${fim}</span>
                        </div>
                    `;
                    container.appendChild(item);
                });
            } catch (erro) {
                console.error('Erro ao carregar avisos:', erro);
                container.innerHTML =
                    '<div class="aviso-item aviso-red">Avisos temporariamente indisponíveis.</div>';
            }
        }

        async function iniciar() {
            await Promise.allSettled([atualizarIri(), carregarAvisos()]);

            /* Apenas o IRI é atualizado automaticamente, de hora a hora. */
            window.setInterval(atualizarIri, intervaloAtualizacaoIriMs);
        }

        iniciar();
    </script>
</body>
</html>
