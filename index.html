<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa IPMA - Viana do Castelo</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; }
        #map { height: 100vh; width: 100%; }
    </style>
</head>
<body>

<div id="map"></div>

<script>
    const map = L.map('map').setView([41.85, -8.3], 10);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap contributors'
    }).addTo(map);

    const coresIncendio = {
        1: '#84C776', 2: '#FFD700', 3: '#FFA500', 4: '#FF0000', 5: '#800080'
    };

    async function carregarDados() {
        try {
            // Teste 1: Ligar ao IPMA
            const resRcm = await fetch('https://api.ipma.pt/open-data/forecast/meteorology/rcm/rcm-d0.json');
            if (!resRcm.ok) {
                throw new Error("O IPMA rejeitou a ligação. Código: " + resRcm.status);
            }
            
            // Verificar se os dados do IPMA são válidos
            const textRcm = await resRcm.text();
            let dataRcm;
            try {
                dataRcm = JSON.parse(textRcm);
            } catch(e) {
                throw new Error("O IPMA enviou uma resposta com formato inválido.");
            }
            
            const rcmViana = dataRcm.data.filter(item => item.dico && item.dico.startsWith('16'));
            const riscoPorConcelho = {};
            rcmViana.forEach(item => { riscoPorConcelho[item.dico] = item.rcm; });

            // Teste 2: Ligar ao Mapa GeoJSON
            const resGeoJson = await fetch('https://raw.githubusercontent.com/dssg-pt/covid19pt-data/master/extra/concelhos.geojson');
            if (!resGeoJson.ok) {
                throw new Error("O ficheiro do Mapa (GeoJSON) não foi encontrado online. Código: " + resGeoJson.status);
            }
            
            // Verificar se o mapa é válido
            const textGeo = await resGeoJson.text();
            let geoJsonPt;
            try {
                geoJsonPt = JSON.parse(textGeo);
            } catch(e) {
                throw new Error("O ficheiro do Mapa não está num formato JSON válido.");
            }

            const geoJsonViana = {
                type: "FeatureCollection",
                features: geoJsonPt.features.filter(f => f.properties.DI == "16")
            };

            // Desenhar os polígonos
            L.geoJSON(geoJsonViana, {
                style: function (feature) {
                    const dico = feature.properties.DI + feature.properties.CO; 
                    const nivelRisco = riscoPorConcelho[dico] || 1; 
                    return { fillColor: coresIncendio[nivelRisco], weight: 2, opacity: 1, color: '#ffffff', dashArray: '3', fillOpacity: 0.7 };
                },
                onEachFeature: function (feature, layer) {
                    const nome = feature.properties.NAME_2;
                    const dico = feature.properties.DI + feature.properties.CO;
                    const risco = riscoPorConcelho[dico] || 'Desconhecido';
                    layer.bindPopup(`<b>${nome}</b><br>Risco de Incêndio: Nível ${risco}`);
                }
            }).addTo(map);

        } catch (error) {
            console.error(error);
            alert("ERRO DETETADO:\n" + error.message);
        }
    }

    carregarDados();
</script>
</body>
</html>
