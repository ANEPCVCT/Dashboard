<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Operacional - Alto Minho (Com Sobreposição)</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-omnivore@0.3.4/leaflet-omnivore.min.js"></script>
    
    <style>
        body, html { margin: 0; padding: 0; height: 100%; font-family: sans-serif; background-color: #f0f0f0; overflow: hidden; }

        /* Estrutura Principal */
        #main-container { display: flex; height: 100vh; position: relative; } /* Adicionado position: relative */

        /* Barra Lateral Esquerda */
        #sidebar {
            width: 260px; background-color: white; border-right: 2px solid #333;
            display: flex; flex-direction: column; padding: 10px; box-sizing: border-box;
            z-index: 10; /* Garante que a barra lateral fica por cima se necessário */
        }
        .logo-container { text-align: center; margin-bottom: 10px; }
        .logo-container img { max-width: 90%; height: auto; }
        #sidebar-title { font-size: 20px; font-weight: bold; text-align: center; color: #333; margin-top: 10px;}
        
        #controls-area { flex: 1; display: flex; flex-direction: column; margin-top: 20px; border-top: 1px solid #ccc; padding-top: 10px;}
        .dropdown-box { width: 100%; padding: 10px; font-size: 18px; font-weight: bold; border: 2px solid #333; border-radius: 5px; }
        #sidebar-map-placeholder { flex: 1; background-color: #e0e0e0; border: 2px dashed #999; margin-top: 10px; display: flex; align-items: center; justify-content: center; color: #666; font-style: italic;}

        /* Área Principal do Dashboard (CSS Grid) */
        #dashboard-grid {
            flex: 1; display: grid; gap: 10px; padding: 10px; box-sizing: border-box;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(2, 1fr);
            grid-template-areas: 
                "pir pir avisos"
                "pir-plus1 pir-plus2 palco-vazio";
        }

        .palco {
            background-color: white; border: 2px solid #333; border-radius: 8px;
            overflow: hidden; display: flex; flex-direction: column;
        }
        .palco-titulo { font-size: 18px; font-weight: bold; color: #666; padding: 5px 8px; border-bottom: 1px solid #ccc; background-color: #f9f9f9;}
        .palco-conteudo { flex: 1; position: relative; min-height: 150px;}

        #palco-pir { grid-area: pir; }
        #palco-avisos { grid-area: avisos; }
        #palco-pir-plus1 { grid-area: pir-plus1; }
        #palco-pir-plus2 { grid-area: pir-plus2; }
        #palco-vazio { grid-area: palco-vazio; background: #fafafa; display: flex; align-items: center; justify-content: center; color: #999; }

        .mapa-leaflet { width: 100%; height: 100%; background: #eee; }

        #avisos-conteudo { padding: 10px; display: flex; flex-direction: column; gap: 5px; overflow-y: auto; font-size: 13px;}
        .aviso-item { display: flex; align-items: center; border-radius: 5px; padding: 5px; border: 1px solid #ccc; }
        .aviso-icone { width: 28px; height: 28px; margin-right: 8px; }
        .aviso-texto { flex: 1; line-height: 1.2; }
        .aviso-tempo { font-weight: bold; color: #333; display: block; font-size: 11px;}

        .aviso-yellow { background-color: #FFFDE7; border-color: #FBC02D; }
        .aviso-orange { background-color: #FFF3E0; border-color: #F57C00; }
        .aviso-red { background-color: #FFEBEE; border-color: #D32F2F; }
        .aviso-green { background-color: #E8F5E9; border-color: #388E3C; }

        /* --- Estilo da Sobreposição de Imagem (Traçado) --- */
        #global-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 100; /* Um valor alto para ficar por cima de tudo */
            pointer-events: none; /* Crucial: permite que os cliques passem para os elementos por baixo */
            display: none; /* Escondido por defeito, será ativado pelo JS */
        }
        #global-overlay img {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Ou 'contain', dependendo de como a imagem deve encaixar */
        }

    </style>
</head>
<body>

<div id="main-container">
    <!-- Sobreposição Global (Traçado) -->
    <div id="global-overlay">
        <!-- Substitui o nome do ficheiro pelo nome real que carregaste -->
        <img src="traçado_dashboard.png" alt="Sobreposição de Traçado">
    </div>

    <!-- Barra Lateral Esquerda -->
    <div id="sidebar">
        <div class="logo-container">
            <img src="https://upload.wikimedia.org/wikipedia/commons/f/f8/Escudo_da_Autoridade_Nacional_de_Emergência_e_Proteção_Civil.svg" alt="ANEPC">
        </div>
        <div id="sidebar-title">Comando Sub-Regional<br>do Alto Minho</div>
        <div id="controls-area">
            <strong>Nível Operacional (CDOS):</strong>
            <select class="dropdown-box">
                <option>N (Normal)</option>
                <option>I (Elevado)</option>
                <option>II (Muito Elevado)</option>
                <option>III (Máximo)</option>
                <option>IV (Catástrofe)</option>
            </select>
            <div id="sidebar-map-placeholder">Mapa Predefinido</div>
        </div>
        <div class="logo-container" style="margin-top: auto">
             <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/4/41/Flag_of_Portugal.svg/1200px-Flag_of_Portugal.svg.png" alt="Portugal">
        </div>
    </div>

    <!-- Área Principal do Dashboard -->
    <div id="dashboard-grid">
        <div class="palco" id="palco-pir">
            <div class="palco-titulo">PIR (Risco Incêndio) - HOJE</div>
            <div class="palco-conteudo">
                <div id="mapa-pir0" class="mapa-leaflet"></div>
            </div>
        </div>
        <div class="palco" id="palco-avisos">
            <div class="palco-titulo">Avisos Meteorológicos</div>
            <div class="palco-conteudo" id="avisos-conteudo">A carregar avisos...</div>
        </div>
        <div class="palco" id="palco-pir-plus1">
            <div class="palco-titulo">PIR (Risco Incêndio) - AMANHÃ</div>
            <div class="palco-conteudo">
                <div id="mapa-pir1" class="mapa-leaflet"></div>
            </div>
        </div>
        <div class="palco" id="palco-pir-plus2">
            <div class="palco-titulo">PIR (Risco Incêndio) - DEPOIS DE AMANHÃ</div>
            <div class="palco-conteudo">
                <div id="mapa-pir2" class="mapa-leaflet"></div>
            </div>
        </div>
        <div class="palco" id="palco-vazio">Área Reservada</div>
    </div>
</div>

<script>
    // Configuração dos Mapas
    const centroMapa = [41.85, -8.3];
    const zoomMapa = 10;
    const tileUrl = 'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png';

    const mapHoje = L.map('mapa-pir0', { zoomControl: false }).setView(centroMapa, zoomMapa);
    const mapAmanha = L.map('mapa-pir1', { zoomControl: false }).setView(centroMapa, zoomMapa);
    const mapDepois = L.map('mapa-pir2', { zoomControl: false }).setView(centroMapa, zoomMapa);

    L.tileLayer(tileUrl).addTo(mapHoje);
    L.tileLayer(tileUrl).addTo(mapAmanha);
    L.tileLayer(tileUrl).addTo(mapDepois);

    // Variáveis Globais de Dados
    const coresIncendio = { 1: '#84C776', 2: '#FFD700', 3: '#FFA500', 4: '#FF0000', 5: '#800080' };
    const classesAvisos = { 'yellow': 'aviso-yellow', 'orange': 'aviso-orange', 'red': 'aviso-red', 'green': 'aviso-green' };
    
    // Simulação do carregamento de dados (exemplo simplificado)
    function iniciarSimulacao() {
        const concelhos = ['arcos', 'caminha', 'melgaço', 'monção', 'coura', 'pbarca', 'plima', 'valença', 'viana', 'cerveira'];
        
        // Cores fixas para simular o RRC 3 ("D0, amanhã e depois")
        const color = coresIncendio[3];

        concelhos.forEach(c => {
            const urlKML = `./${c}.kml`;
            
            // Exemplo simplificado usando Leaflet.Omnivore.
            // Precisarias de lógica adicional para mapear o Risco RRC para as cores.
            const run = omnivore.kml(urlKML)
                .on('ready', function(layer) {
                    layer.eachLayer(function(l) {
                        l.setStyle({
                            fillColor: color,
                            weight: 2,
                            opacity: 1,
                            color: 'white',
                            fillOpacity: 0.7
                        });
                        l.bindPopup(`<b>${c.toUpperCase()}</b><br>Risco RRC: Nível ${3}`);
                    });
                    this.fitBounds(run.getBounds()); // Mantém no mapa
                })
                .addTo(mapHoje); // Só para o exemplo, devia ser para os 3
        });
    }
    
    // iniciarSimulacao(); // Desativa a simulação para não quebrar se não houver KMLs

    // Carregar Avisos Meteorológicos
    async function carregarAvisos() {
        const container = document.getElementById('avisos-conteudo');
        
        // Dicionário de ícones para tipos de aviso (exemplos)
        const tipoAvisoIcons = {
            "Precipitação": "https://cdn-icons-png.flaticon.com/512/4005/4005771.png",
            "Vento": "https://cdn-icons-png.flaticon.com/512/5444/5444465.png",
            "Tempo Frio": "https://cdn-icons-png.flaticon.com/512/5353/5353179.png",
            "Nevoeiro": "https://cdn-icons-png.flaticon.com/512/760/760444.png",
            "Agitação Marítima": "https://cdn-icons-png.flaticon.com/512/3104/3104564.png",
            "Trovoada": "https://cdn-icons-png.flaticon.com/512/4150/4150897.png"
        };

        try {
            const res = await fetch('https://api.ipma.pt/open-data/forecast/warnings/warnings_www.json');
            const data = await res.json();
            
            // Filtra por VVC (Viana do Castelo) e remove avisos verdes
            const avisosViana = data.filter(a => a.idAreaAviso === 'VVC' && a.awarenessLevelID !== 'green');

            if (avisosViana.length === 0) {
                container.innerHTML = '<div class="aviso-item aviso-green">Sem avisos meteorológicos ativos para Viana do Castelo.</div>';
                return;
            }

            container.innerHTML = ''; // Limpa o carregamento
            avisosViana.forEach(aviso => {
                const icone = tipoAvisoIcons[aviso.awarenessTypeName] || "https://cdn-icons-png.flaticon.com/512/1795/1795519.png"; // Ícone genérico se não houver
                const classeFundo = classesAvisos[aviso.awarenessLevelID] || '';
                const inicio = new Date(aviso.startTime).toLocaleString('pt-PT', {day: '2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit'});
                const fim = new Date(aviso.endTime).toLocaleString('pt-PT', {day: '2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit'});

                const avisoHtml = `
                    <div class="aviso-item ${classeFundo}">
                        <img src="${icone}" class="aviso-icone" alt="${aviso.awarenessTypeName}">
                        <div class="aviso-texto">
                            <strong>${aviso.awarenessTypeName}</strong><br>
                            <span class="aviso-tempo">Início: ${inicio} - Fim: ${fim}</span>
                        </div>
                    </div>
                `;
                container.innerHTML += avisoHtml;
            });

        } catch (erro) {
            console.error("Erro ao carregar avisos:", erro);
            container.innerHTML = '<div style="color:red; text-align:center;">Erro ao carregar dados de avisos.</div>';
        }
    }

    // Função para verificar se a imagem de sobreposição existe e mostrá-la
    function verificarEMostrarSobreposicao() {
        const overlay = document.getElementById('global-overlay');
        const img = overlay.querySelector('img');

        // Cria uma nova imagem para testar se carrega
        const testImg = new Image();
        testImg.onload = function() {
            // A imagem existe e carregou
            console.log("Sobreposição de traçado carregada com sucesso.");
            overlay.style.display = 'block';
        };
        testImg.onerror = function() {
            // A imagem não existe na raiz ou tem erro
            console.warn("Sobreposição de traçado não encontrada na raiz. Verifique o nome do ficheiro (traçado_dashboard.png) no GitHub.");
            // Garante que o dashboard não fica bloqueado se a imagem falhar
        };
        testImg.src = img.src; // Tenta carregar a imagem
    }

    // Iniciar carregamentos
    carregarAvisos();
    verificarEMostrarSobreposicao(); // Tenta carregar o traçado

</script>
</body>
</html>
