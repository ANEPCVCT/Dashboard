<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa IPMA - Viana do Castelo</title>
    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- Leaflet Omnivore (Link Estável Atualizado) -->
    <script src="https://unpkg.com/leaflet-omnivore@0.3.4/leaflet-omnivore.min.js"></script>
    
    <style>
        body, html { margin: 0; padding: 0; height: 100%; font-family: sans-serif; }
        #map { height: 100vh; width: 100%; }
        
        .controlo-mapa {
            position: absolute;
            top: 15px;
            right: 15px;
            z-index: 1000;
            background: white;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .controlo-mapa button {
            display: block;
            width: 100%;
            margin-top: 10px;
            padding: 10px;
            border: none;
            border-radius: 5px;
            background: #f0f0f0;
            cursor: pointer;
            font-weight: bold;
        }
        .controlo-mapa button:hover { background: #e0e0e0; }
    </style>
</head>
<body>

<div class="controlo-mapa">
    <strong>Escolher Dados (IPMA):</strong>
    <button onclick="mudarModo('iri')">🔥 Risco de Incêndio</button>
    <button onclick="mudarModo('avisos')">⚠️ Avisos Viana do Castelo</button>
</div>

<div id="map"></div>

<script>
    const map = L.map('map').setView([41.85, -8.3], 10);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap contributors | Dados: IPMA & KML'
    }).addTo(map);

    let riscoPorConcelho = {};
    let maiorAvisoNivel = 'green';
    let maiorAvisoTexto = 'Sem avisos ativos';
    let modoAtual = 'iri';
    let grupoCamadas = L.featureGroup().addTo(map);

    const coresIncendio = { 1: '#84C776', 2: '#FFD700', 3: '#FFA500', 4: '#FF0000', 5: '#800080' };
    const coresAvisos = { 'green': '#84C776', 'yellow': '#FFD700', 'orange': '#FFA500', 'red': '#FF0000' };
    const pesoAvisos = { 'green': 0, 'yellow': 1, 'orange': 2, 'red': 3 };

    // Lista dos 10 concelhos com os teus ficheiros KML exatos e códigos DICO do IPMA
    const concelhosLista = [
        { arquivo: 'avv.kml', nome: 'Arcos de Valdevez', dico: '1601' },
        { arquivo: 'CMN.kml', nome: 'Caminha', dico: '1602' },
        { arquivo: 'mel.kml', nome: 'Melgaço', dico: '1603' },
        { arquivo: 'mon.kml', nome: 'Monção', dico: '1604' },
        { arquivo: 'pc.kml', nome: 'Paredes de Coura', dico: '1605' },
        { arquivo: 'pb.kml', nome: 'Ponte da Barca', dico: '1606' },
        { arquivo: 'pl.kml', nome: 'Ponte de Lima', dico: '1607' },
        { arquivo: 'val.kml', nome: 'Valença', dico: '1608' },
        { arquivo: 'vct.kml', nome: 'Viana do Castelo', dico: '1609' },
        { arquivo: 'vnc.kml', nome: 'Vila Nova de Cerveira', dico: '1610' }
    ];

    async function carregarDadosIPMA() {
        try {
            // 1. Risco de Incêndio (IRI)
            const resRcm = await fetch('https://api.ipma.pt/open-data/forecast/meteorology/rcm/rcm-d0.json');
            const dataRcm = await resRcm.json();
            if (dataRcm.local) {
                for (const dico in dataRcm.local) {
                    if (dico.startsWith('16')) {
                        riscoPorConcelho[dico] = dataRcm.local[dico].data.rcm;
                    }
                }
            }

            // 2. Avisos Meteorológicos
            const resAviso = await fetch('https://api.ipma.pt/open-data/forecast/warnings/warnings_www.json');
            const dataAviso = await resAviso.json();
            const avisosVVC = dataAviso.filter(a => a.idAreaAviso === 'VVC');
            avisosVVC.forEach(aviso => {
                if (pesoAvisos[aviso.awarenessLevelID] > pesoAvisos[maiorAvisoNivel]) {
                    maiorAvisoNivel = aviso.awarenessLevelID;
                    maiorAvisoTexto = aviso.awarenessTypeName;
                }
            });
        } catch (erro) {
            console.error("Erro ao carregar dados do IPMA:", erro);
        }
    }

    async function inicializarMapa() {
        await carregarDadosIPMA();
        desenharConcelhos();
    }

    function desenharConcelhos() {
        grupoCamadas.clearLayers();

        concelhosLista.forEach(item => {
            const customLayer = L.geoJson(null, {
                style: function () {
                    let cor = '#cccccc';
                    if (modoAtual === 'iri') {
                        const risco = riscoPorConcelho[item.dico] || 1;
                        cor = coresIncendio[risco];
                    } else if (modoAtual === 'avisos') {
                        cor = coresAvisos[maiorAvisoNivel];
                    }
                    return { fillColor: cor, weight: 2, color: '#ffffff', fillOpacity: 0.75 };
                },
                onEachFeature: function (feature, layer) {
                    if (modoAtual === 'iri') {
                        const risco = riscoPorConcelho[item.dico] || 'N/A';
                        layer.bindPopup(`<b>${item.nome}</b><br>Risco Incêndio: <b>Nível ${risco}</b>`);
                    } else {
                        layer.bindPopup(`<b>${item.nome}</b><br>Aviso Distrital: <b>${maiorAvisoTexto}</b>`);
                    }
                }
            });

            omnivore.kml(`./${item.arquivo}`, null, customLayer)
                .on('ready', function(e) {
                    grupoCamadas.addLayer(e.target);
                    map.fitBounds(grupoCamadas.getBounds());
                })
                .addTo(grupoCamadas);
        });
    }

    function mudarModo(modo) {
        modoAtual = modo;
        desenharConcelhos();
    }

    inicializarMapa();
</script>
</body>
</html>
