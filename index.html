<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa IPMA - Viana do Castelo</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; }
        #map { height: 100vh; width: 100%; }
    </style>
</head>
<body>

<div id="map"></div>

<script>
    const map = L.map('map').setView([41.85, -8.3], 10);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap contributors | Dados: IPMA'
    }).addTo(map);

    const coresIncendio = {
        1: '#84C776', 2: '#FFD700', 3: '#FFA500', 4: '#FF0000', 5: '#800080'
    };

    async function carregarDados() {
        try {
            // 1. DADOS DO IPMA (Código Blindado)
            const resRcm = await fetch('https://api.ipma.pt/open-data/forecast/meteorology/rcm/rcm-d0.json');
            const dataRcm = await resRcm.json();
            
            let riscoPorConcelho = {};
            
            // O IPMA pode enviar os dados num array directo ou dentro de um '.data'
            const rcmArray = Array.isArray(dataRcm) ? dataRcm : (dataRcm.data || []);
            
            // Extrair apenas os de Viana (DICO começa por 16)
            rcmArray.forEach(item => {
                if (item && item.dico && String(item.dico).startsWith('16')) {
                    riscoPorConcelho[item.dico] = item.rcm;
                }
            });

            // Fallback caso o IPMA envie um dicionário em vez de array
            if (rcmArray.length === 0 && typeof dataRcm === 'object') {
                const alvo = dataRcm.data || dataRcm;
                Object.keys(alvo).forEach(key => {
                    if (String(key).startsWith('16')) {
                        riscoPorConcelho[key] = alvo[key].rcm || alvo[key];
                    }
                });
            }

            // 2. DADOS DO MAPA (Código Blindado)
            const resGeoJson = await fetch('https://raw.githubusercontent.com/dssg-pt/covid19pt-data/master/extra/concelhos.geojson');
            const geoJsonPt = await resGeoJson.json();

            const featureList = geoJsonPt.features || [];
            
            const geoJsonViana = {
                type: "FeatureCollection",
                features: featureList.filter(f => f.properties && f.properties.DI == "16")
            };

            // 3. DESENHAR POLÍGONOS
            L.geoJSON(geoJsonViana, {
                style: function (feature) {
                    const dico = feature.properties.DI + feature.properties.CO; 
                    const nivelRisco = riscoPorConcelho[dico] || 1; 
                    return { 
                        fillColor: coresIncendio[nivelRisco] || '#84C776', 
                        weight: 2, 
                        opacity: 1, 
                        color: '#ffffff', 
                        dashArray: '3', 
                        fillOpacity: 0.7 
                    };
                },
                onEachFeature: function (feature, layer) {
                    const nome = feature.properties.NAME_2 || 'Concelho';
                    const dico = feature.properties.DI + feature.properties.CO;
                    const risco = riscoPorConcelho[dico] || 'Desconhecido';
                    layer.bindPopup(`<b>${nome}</b><br>Risco de Incêndio: Nível ${risco}`);
                }
            }).addTo(map);

        } catch (error) {
            console.error(error);
            alert("Continuamos com dificuldades a ler os dados. Detalhe: " + error.message);
        }
    }

    carregarDados();
</script>
</body>
</html>
