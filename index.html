<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Operacional - Alto Minho</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-omnivore@0.3.4/leaflet-omnivore.min.js"></script>
    
    <style>
        body, html { margin: 0; padding: 0; height: 100%; font-family: sans-serif; background-color: #f0f0f0; overflow: hidden; }

        /* --- Estrutura Principal (Sidebar + Content) --- */
        #main-container {
            display: flex;
            height: 100vh;
        }

        /* --- Barra Lateral Esquerda (Logos e Comandos) --- */
        #sidebar {
            width: 260px;
            background-color: white;
            border-right: 2px solid #333;
            display: flex;
            flex-direction: column;
            padding: 10px;
            box-sizing: border-box;
        }
        .logo-container { text-align: center; margin-bottom: 10px; }
        .logo-container img { max-width: 90%; height: auto; }
        #sidebar-title { font-size: 24px; font-weight: bold; text-align: center; color: #333; margin-top: 10px;}
        
        /* Área da Dropdown e Mapa Predefinido */
        #controls-area { flex: 1; display: flex; flex-direction: column; margin-top: 20px; border-top: 1px solid #ccc; padding-top: 10px;}
        .dropdown-box { width: 100%; padding: 10px; font-size: 18px; font-weight: bold; border: 2px solid #333; border-radius: 5px; }
        #sidebar-map-placeholder { flex: 1; background-color: #e0e0e0; border: 2px dashed #999; margin-top: 10px; display: flex; align-items: center; justify-content: center; color: #666; font-style: italic;}

        /* --- Área Principal do Dashboard (Grid) --- */
        #dashboard-grid {
            flex: 1;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(2, 1fr);
            gap: 10px;
            padding: 10px;
            box-sizing: border-box;
        }

        /* Estilo Genérico dos Painéis (Palcos) */
        .palco {
            background-color: white;
            border: 2px solid #333;
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .palco-titulo { font-size: 20px; font-weight: bold; color: #666; padding: 5px 10px; border-bottom: 1px solid #ccc; background-color: #f9f9f9;}
        .palco-conteudo { flex: 1; position: relative; }

        /* Layout Específico para os mapas */
        .mapa-container { width: 100%; height: 100%; }

        /* --- Avisos Meteorológicos (Timeline) --- */
        #avisos-conteudo {
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            overflow-y: auto;
        }
        .aviso-item {
            display: flex;
            align-items: center;
            background-color: #fff3cd; /* Amarelo placeholder */
            border: 1px solid #ffeeba;
            padding: 8px;
            border-radius: 5px;
        }
        .aviso-icone { width: 30px; height: 30px; margin-right: 10px; }
        .aviso-info { flex: 1; font-size: 14px; }
        .aviso-hora { font-weight: bold; display: block; }

        /* Cores de Fundo para Níveis de Aviso (Exemplo) */
        .aviso-amarelo { background-color: #fff3cd; border-color: #ffeeba; }
        .aviso-laranja { background-color: #ffeeba; border-color: #ffdf7e; }
        .aviso-vermelho { background-color: #f8d7da; border-color: #f5c6cb; }

    </style>
</head>
<body>

<div id="main-container">
    <!-- Barra Lateral -->
    <div id="sidebar">
        <div class="logo-container">
            <img src="https://i.imgur.com/pXW69uP.png" alt="Logo ANEPC"> <!-- Logo ANEPC placeholder -->
        </div>
        <div id="sidebar-title">Comando Sub-Regional<br>do Alto Minho</div>
        <div class="logo-container" style="margin-top: auto">
             <img src="https://i.imgur.com/U7X5Y4v.png" alt="Logo Regional"> <!-- Logo Regional placeholder -->
        </div>
