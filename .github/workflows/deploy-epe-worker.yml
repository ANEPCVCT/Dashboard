name: Deploy EPE Worker

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/deploy-epe-worker.yml

permissions:
  contents: read

concurrency:
  group: deploy-epe-worker
  cancel-in-progress: false

jobs:
  deploy:
    name: Testar e publicar Worker
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Obter o repositório
        uses: actions/checkout@v6

      - name: Confirmar configuração protegida
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          EPE_OPERATOR_KEY: ${{ secrets.EPE_OPERATOR_KEY }}
          EPE_GITHUB_TOKEN: ${{ secrets.EPE_GITHUB_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Falta o segredo CLOUDFLARE_ACCOUNT_ID."; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Falta o segredo CLOUDFLARE_API_TOKEN."; exit 1; }
          test -n "$EPE_OPERATOR_KEY" || { echo "Falta o segredo EPE_OPERATOR_KEY."; exit 1; }
          test -n "$EPE_GITHUB_TOKEN" || { echo "Falta o segredo EPE_GITHUB_TOKEN."; exit 1; }
          [[ "$CLOUDFLARE_ACCOUNT_ID" =~ ^[A-Za-z0-9_-]+$ ]] || {
            echo "CLOUDFLARE_ACCOUNT_ID contém caracteres inválidos. Copie apenas o Account ID, sem rótulos, espaços ou aspas."
            exit 1
          }

      - name: Testar o Worker
        working-directory: cloudflare-worker
        run: npm test

      - name: Registar o subdomínio workers.dev
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          RESPONSE="$(curl --fail-with-body --silent --show-error \
            --request PUT \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            --header 'Content-Type: application/json' \
            --data '{"subdomain":"anepcvct"}' \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/subdomain")"
          printf '%s' "$RESPONSE" | python -c \
            'import json, sys; data = json.load(sys.stdin); assert data.get("success") is True; assert data.get("result", {}).get("subdomain") == "anepcvct"'

      - name: Publicar o Worker
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare-worker
          command: deploy
          secrets: |
            EPE_OPERATOR_KEY
            GITHUB_TOKEN
        env:
          EPE_OPERATOR_KEY: ${{ secrets.EPE_OPERATOR_KEY }}
          GITHUB_TOKEN: ${{ secrets.EPE_GITHUB_TOKEN }}

      - name: Validar o endpoint publicado
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          test -n "$DEPLOYMENT_URL" || { echo "A Cloudflare não devolveu o URL da implantação."; exit 1; }
          HEALTH_URL="${DEPLOYMENT_URL%/}/health"
          RESPONSE="$(curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 3 \
            -H 'Origin: https://anepcvct.github.io' "$HEALTH_URL")"
          printf '%s' "$RESPONSE" | python -c \
            'import json, sys; data = json.load(sys.stdin); assert data == {"ok": True, "service": "dashboard-anepc-epe"}'
