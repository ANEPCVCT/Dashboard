name: Verificar ativação EPE Worker

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/verify-epe-worker-bootstrap.yml

permissions:
  contents: read

jobs:
  verify:
    name: Aguardar e validar o endpoint
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Aguardar o certificado e validar health
        env:
          HEALTH_URL: https://dashboard-anepc-epe.anepcvct.workers.dev/health
        run: |
          for tentativa in $(seq 1 56); do
            : > curl-error.txt
            if RESPONSE="$(curl --fail --silent --show-error \
              --connect-timeout 10 --max-time 20 \
              -H 'Origin: https://anepcvct.github.io' \
              "$HEALTH_URL" 2>curl-error.txt)" && \
              printf '%s' "$RESPONSE" | python -c \
                'import json, sys; data = json.load(sys.stdin); raise SystemExit(0 if data == {"ok": True, "service": "dashboard-anepc-epe"} else 1)'
            then
              echo "Endpoint EPE validado na tentativa ${tentativa}."
              exit 0
            fi

            echo "Tentativa ${tentativa}/56 ainda sem resposta válida."
            tail -n 1 curl-error.txt || true
            sleep 15
          done

          echo "O endpoint EPE não ficou disponível dentro da janela de validação."
          exit 1
